<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polonium — ticket</title>
<meta name="theme-color" content="#0e0d0b">
<link rel="preload" href="fonts/DarkerGrotesque-900-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="ticket.css?v=2">
</head>
<body>
<div id="bg" aria-hidden="true"><div class="grid"></div></div>
<main class="t-wrap">
  <div class="t-card">
    <div class="t-head"><span>polonium · <b id="t-ref">ticket</b></span><span id="t-pill" class="pill">…</span></div>
    <div class="t-sub" id="t-sub"></div>
    <div id="t-form">
      <div class="chat-days" role="group" aria-label="wybierz plan">
        <button data-days="1" class="active">1D · 1zł</button>
        <button data-days="7">7D · 7zł</button>
        <button data-days="30">30D · 30zł</button>
        <button data-days="lifetime">LIFE · 99zł</button>
      </div>
      <div class="chat-custom"><input id="t-days" type="number" min="1" max="30" placeholder="własna liczba dni (max 30)" aria-label="własna liczba dni"><span id="t-price">1 zł</span></div>
      <input id="t-nick" maxlength="24" placeholder="nick (musi zgadzać się z Tipply)" autocomplete="off" aria-label="nick">
      <input id="t-contact" maxlength="64" placeholder="kontakt: discord / e-mail" autocomplete="off" aria-label="kontakt">
      <button id="t-start" class="btn big">start</button>
    </div>
    <div id="t-msgs" aria-live="polite"></div>
    <div id="t-input" class="hidden"><input id="t-text" maxlength="1000" placeholder="wiadomość..." aria-label="wiadomość"><button id="t-send" aria-label="wyślij">➤</button></div>
    <div class="t-foot"><button id="t-close" class="hidden">zamknij ticket</button><a href="../">← strona główna</a></div>
  </div>
</main>
<script src="ticket.js"></script>
</body>
</html>
